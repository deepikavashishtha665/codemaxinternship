<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog App - Create Post</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <h2>DevBlog</h2>
        <div>
            <a href="dashboard.html">Dashboard</a>
            <a href="index.html">Home</a>
        </div>
    </nav>
    <div class="container">
        <div class="card">
            <h2>Create New Blog Post</h2>
            <form style="margin-top: 1rem;">
                <div class="form-group">
                    <label>Blog Title</label>
                    <input type="text" placeholder="Enter title" required>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <input type="text" placeholder="e.g. Technology, Web Dev" required>
                </div>
                <div class="form-group">
                    <label>Content</label>
                    <textarea rows="6" placeholder="Write your content here..." required></textarea>
                </div>
                <button type="submit" class="btn">Publish Blog</button>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
